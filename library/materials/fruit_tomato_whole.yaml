schema: alloy.material/1
name: fruit_tomato_whole
density:
  value: 880.0
  source: measured
  unc: [840.0, 960.0]
  note: 'DOC: Table 1 row ''Density 0.88 0.04 4.96'' (rho = M/V in g cm-3, mean, SD, CV), Lak et al., CIGR Journal 2018, https://cigrjournal.org/index.php/Ejounral/article/view/4880'
surface:
  mu_static:
    value: 0.25
    source: measured
    unc: [0.23, 0.4]
    note: 'SNIPPET: ''The coefficient of static friction for tomato samples was highest on plastic (0.26), followed by wood
      (0.25) and carton (0.23)'' (search summary, source not opened), https://www.ajol.info/index.php/ise/article/view/249292'
  mu_dynamic:
    value: 0.2
    source: model
    unc: [0.1, 0.3]
    note: 'ESTIMATE: below mu_static; no measured kinetic value found'
  restitution:
    value: 0.2
    source: model
    unc: [0.05, 0.4]
    note: 'ESTIMATE: no measured value found; a ripe tomato is soft and lossy'
elastic:
  youngs:
    value: 200000.0
    source: measured
    unc: [50000.0, 250000.0]
    note: 'DOC: whole-fruit compression, ''giving the elastic modulus and Poisson''s ratio for engineering stress-strain as
      0.1628MPa and 0.2563 respectively while the transverse loading gave 0.2158 and 0.2596 respectively'' and ''isotropic
      giving approximate elastic modulus of about 0.2MPa and Poisson''s ratio of 0.3'', Ihueze and Okafor 2011, https://journals.unizik.edu.ng/ujeas/article/download/1633/1307/4499;
      a plate-compression formula gives 0.05 MPa (Lak et al. 2018, https://cigrjournal.org/index.php/Ejounral/article/view/4880)'
  poisson:
    value: 0.3
    source: measured
    unc: [0.25, 0.45]
    note: 'DOC: ''isotropic giving approximate elastic modulus of about 0.2MPa and Poisson''s ratio of 0.3'', Ihueze and Okafor
      2011, https://journals.unizik.edu.ng/ujeas/article/download/1633/1307/4499'
