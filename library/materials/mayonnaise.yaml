schema: alloy.material/1
name: mayonnaise
density:
  value: 916.0
  source: measured
  unc: [910.0, 940.0]
  note: 'pycnometer 0.916 g/cm3 (X-ray CT 0.937): Table 5 row ''Mayonnaise 0.937a 0.048 0.916a 0.006'', Kelkar, Boushey and
    Okos 2015, A Method to Determine the Density of Foods using X-ray Imaging, J. Food Eng. (https://pmc.ncbi.nlm.nih.gov/articles/PMC4384159/)'
surface:
  mu_static:
    value: 0.0
    source: model
    note: 'paste: no Coulomb friction, wall drag comes from viscosity'
  mu_dynamic:
    value: 0.0
    source: model
    note: 'paste: no Coulomb friction'
  restitution:
    value: 0.0
    source: model
    note: 'paste: inelastic'
plastic:
  yield_stress:
    value: 96.0
    source: measured
    unc: [65.0, 127.0]
    note: 'vane at 0.05 rpm, reduced-fat commercial mayonnaises (5.2-22.5 % fat; regular mayonnaise is about 75-80 % oil,
      not measured here), the 22.5 % product: ''highest amount of fat (22.5%) presents the lowest yield stress (96 Pa)'' and
      5.2 % fat 127 Pa, Thermo Fisher application note V271 (https://assets.thermofisher.com/TFS-Assets/MSD/Application-Notes/V271-investigation-effect-fat-content-yield-stress-mayonnaise.pdf);
      a squeezable mayonnaise: ''The terminal stress was 65-70 Pa for all waiting times'' (Owens, Hart and McKinley, https://arxiv.org/pdf/1910.10785)'
fluid:
  viscosity:
    value: 2.0
    source: model
    unc: [0.5, 5.0]
    note: 'ESTIMATE, Bingham plastic viscosity: a commercial mayonnaise''s power law ''0% :K = 111.1, n=0.020'' (0-30 1/s;
      Mushtaq et al., Pak. J. Sci. Ind. Res., https://v3.pjsir.org/index.php/physical-sciences/article/download/557/373) gives
      116.3 Pa at 10 1/s; less the 96 Pa yield stress of another product, over 10 1/s = 2.0 Pa s. Range (116.3 - 127..65)
      / 10, floored at 0.5 (the 127 Pa product would give a negative value), to 5.0'
