schema: alloy.material/1
name: tissue_fat_silicone
density:
  value: 1070.0
  source: catalog
  unc: [1060.0, 1080.0]
  note: 'DOC: specific gravity 1.07 (ASTM D-1475), table row ''Ecoflex™ 00‑30 3,000 cps 1.07 26.0 45 min. 4 hours 00-30 200
    psi 10 psi 900% 38 pli < .001 in./in.'' (columns: mixed viscosity, specific gravity, specific volume, pot life, cure time,
    Shore hardness, tensile strength, 100% modulus, elongation at break, Die B tear, shrinkage), Ecoflex series technical
    bulletin, https://www.smooth-on.com/tb/files/ECOFLEX_SERIES_TB.pdf'
surface:
  mu_static:
    value: 1.0
    source: model
    unc: [0.6, 1.5]
    note: 'ESTIMATE: no measured value found; very soft platinum silicone is tacky (''because the silicone tissue is not slippery,
      higher forces must be applied on the suture material'', https://pmc.ncbi.nlm.nih.gov/articles/PMC10116820)'
  mu_dynamic:
    value: 0.8
    source: model
    unc: [0.5, 1.2]
    note: 'ESTIMATE: below mu_static; no measured value found'
  restitution:
    value: 0.2
    source: model
    unc: [0.05, 0.4]
    note: 'ESTIMATE: very soft silicone rubber is dissipative; no measured value found for Ecoflex 00-30'
elastic:
  youngs:
    value: 30000.0
    source: measured
    unc: [25000.0, 81000.0]
    note: 'DOC: ''Young''s modulus was found to be maximum for the Ecoflex ratio 0:1 (0030:0031) (i.e. for 0031 with an average
      of 51 kPa) and minimum for 1:0 (i.e. for 0030 with an average of 30 kPa)'', https://engrxiv.org/preprint/download/4338/11116/9433;
      a shear modulus of ''~27 kPa'' (E ~ 81 kPa) is also reported, https://par.nsf.gov/servlets/purl/10383398'
  poisson:
    value: 0.45
    source: model
    unc: [0.45, 0.49]
    note: 'ESTIMATE: no measured value found; finite-element papers assume 0.49 (''Poisson''s ratio of 0.49 was applied for
      Ecoflex'', https://pmc.ncbi.nlm.nih.gov/articles/PMC13454596); 0.45 keeps the tetrahedral soft-solid route well conditioned'
failure:
  fracture_strain:
    value: 9.0
    source: catalog
    unc: [8.0, 10.0]
    note: 'DOC: elongation at break 900 % (ASTM D-412), table row ''Ecoflex™ 00‑30 3,000 cps 1.07 26.0 45 min. 4 hours 00-30
      200 psi 10 psi 900% 38 pli < .001 in./in.'' (columns: mixed viscosity, specific gravity, specific volume, pot life,
      cure time, Shore hardness, tensile strength, 100% modulus, elongation at break, Die B tear, shrinkage), Ecoflex series
      technical bulletin, https://www.smooth-on.com/tb/files/ECOFLEX_SERIES_TB.pdf'
  fracture_stress:
    value: 1380000.0
    source: catalog
    unc: [1200000.0, 1500000.0]
    note: 'DOC: tensile strength 1.38 MPa = 200 psi (ASTM D-412), table row ''Ecoflex™ 00‑30 3,000 cps 1.07 26.0 45 min. 4
      hours 00-30 200 psi 10 psi 900% 38 pli < .001 in./in.'' (columns: mixed viscosity, specific gravity, specific volume,
      pot life, cure time, Shore hardness, tensile strength, 100% modulus, elongation at break, Die B tear, shrinkage), Ecoflex
      series technical bulletin, https://www.smooth-on.com/tb/files/ECOFLEX_SERIES_TB.pdf'
