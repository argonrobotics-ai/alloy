schema: alloy.material/1
name: tissue_skin_silicone
density:
  value: 1070.0
  source: catalog
  unc: [1060.0, 1080.0]
  note: 'DOC: specific gravity 1.07 (ASTM D-1475), table row ''Dragon Skin™ 10 Fast 23,000 cps 1.07 25.8 8 min. 75 min. 10A
    475 psi 22 psi 1000% 102 pli < .001 in./in.'' (columns: mixed viscosity, specific gravity, specific volume, pot life,
    cure time, Shore A, tensile strength, 100% modulus, elongation at break, Die B tear, shrinkage; ''*All values measured
    after 7 days at 73°F/23°C''), Dragon Skin series technical bulletin, https://www.smooth-on.com/tb/files/DRAGON_SKIN_SERIES_TB.pdf'
surface:
  mu_static:
    value: 0.9
    source: model
    unc: [0.5, 1.3]
    note: 'ESTIMATE: no measured value found for this silicone on steel or plastic; soft platinum silicones grip (''because
      the silicone tissue is not slippery, higher forces must be applied on the suture material'', https://pmc.ncbi.nlm.nih.gov/articles/PMC10116820)'
  mu_dynamic:
    value: 0.7
    source: model
    unc: [0.4, 1.1]
    note: 'ESTIMATE: below mu_static; no measured value found'
  restitution:
    value: 0.3
    source: model
    unc: [0.1, 0.5]
    note: 'ESTIMATE: soft silicone rubber rebound; no measured value found for Dragon Skin 10'
elastic:
  youngs:
    value: 260000.0
    source: model
    unc: [150000.0, 400000.0]
    note: 'ESTIMATE derived from a datasheet value: the ''100% modulus'' 22 psi (151.7 kPa, ASTM D-412) gives a neo-Hookean
      shear modulus mu = 151.7 kPa / 1.75 = 86.7 kPa (uniaxial nominal stress mu (lambda - lambda^-2) at lambda 2) and E =
      3 mu for a nearly incompressible solid; table row ''Dragon Skin™ 10 Fast 23,000 cps 1.07 25.8 8 min. 75 min. 10A 475
      psi 22 psi 1000% 102 pli < .001 in./in.'' (columns: mixed viscosity, specific gravity, specific volume, pot life, cure
      time, Shore A, tensile strength, 100% modulus, elongation at break, Die B tear, shrinkage; ''*All values measured after
      7 days at 73°F/23°C''), Dragon Skin series technical bulletin, https://www.smooth-on.com/tb/files/DRAGON_SKIN_SERIES_TB.pdf'
  poisson:
    value: 0.45
    source: model
    unc: [0.45, 0.49]
    note: 'ESTIMATE: no measured value found; finite-element papers assume 0.49 for platinum silicones (''Young''s modulus
      of 125 kPa and Poisson''s ratio of 0.49 was applied for Ecoflex'', https://pmc.ncbi.nlm.nih.gov/articles/PMC13454596);
      0.45 keeps the tetrahedral soft-solid route well conditioned'
failure:
  fracture_strain:
    value: 10.0
    source: catalog
    unc: [8.0, 11.0]
    note: 'DOC: elongation at break 1000 % (ASTM D-412), table row ''Dragon Skin™ 10 Fast 23,000 cps 1.07 25.8 8 min. 75 min.
      10A 475 psi 22 psi 1000% 102 pli < .001 in./in.'' (columns: mixed viscosity, specific gravity, specific volume, pot
      life, cure time, Shore A, tensile strength, 100% modulus, elongation at break, Die B tear, shrinkage; ''*All values
      measured after 7 days at 73°F/23°C''), Dragon Skin series technical bulletin, https://www.smooth-on.com/tb/files/DRAGON_SKIN_SERIES_TB.pdf'
  fracture_stress:
    value: 3270000.0
    source: catalog
    unc: [2900000.0, 3600000.0]
    note: 'DOC: tensile strength 3.27 MPa = 475 psi (ASTM D-412), table row ''Dragon Skin™ 10 Fast 23,000 cps 1.07 25.8 8
      min. 75 min. 10A 475 psi 22 psi 1000% 102 pli < .001 in./in.'' (columns: mixed viscosity, specific gravity, specific
      volume, pot life, cure time, Shore A, tensile strength, 100% modulus, elongation at break, Die B tear, shrinkage; ''*All
      values measured after 7 days at 73°F/23°C''), Dragon Skin series technical bulletin, https://www.smooth-on.com/tb/files/DRAGON_SKIN_SERIES_TB.pdf'
