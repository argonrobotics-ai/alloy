schema: alloy.material/1
name: dough_wheat
density:
  value: 1076.0
  source: measured
  unc: [1000.0, 1200.0]
  note: 'DOC: unleavened wheat dough (T-500 flour, 30 % water), Table 3 row ''“Mlinci” T-500 30.00 0.700 7.41 48.93 1076''
    and ''The density of dough was determined by weighing a known volume of the dough.''; the same paper cites ''density of
    1000–1200 kg/m3'' for wheat flour dough. Czech J. Food Sci. 23(4):152-158, https://www.agriculturejournals.cz/publicFiles/50561.pdf'
surface:
  mu_static:
    value: 0.6
    source: model
    unc: [0.3, 0.9]
    note: 'ESTIMATE: no measured dough-on-board friction found; sticky dough grips steel and wood (''a strong adhesion of
      the dough to the stainless steel surface can be observed'', https://doi.org/10.1007/s11947-021-02625-y), a floured board
      grips less; swept 0.3-0.8 in simulation practice'
  mu_dynamic:
    value: 0.5
    source: model
    unc: [0.25, 0.8]
    note: 'ESTIMATE: below mu_static; no measured dough value found'
  restitution:
    value: 0.0
    source: model
    unc: [0.0, 0.05]
    note: 'ESTIMATE: dough impacts are plastic (no rebound)'
elastic:
  youngs:
    value: 52000.0
    source: model
    unc: [20000.0, 100000.0]
    note: 'ESTIMATE derived from a measurement: E = 2 G'' (1 + nu) with nu 0.45 from G'' at 1 Hz of a control wheat flour
      dough, table row ''C 0 1.2 ± 0.1 b 4.3 ± 0.8 b 0.78 ± 0.03 a 0.91 ± 0.01 a 18 ± 3 a 0.41 ± 0.02 a'' (G'' 18 ± 3 kPa,
      tan delta 0.41), Foods 2023, 12, 1645, https://pmc.ncbi.nlm.nih.gov/articles/PMC10137421/; simulation inputs for soft
      to hard doughs use 2e4-1e5 Pa (https://arxiv.org/pdf/2403.13783)'
  poisson:
    value: 0.45
    source: model
    unc: [0.4, 0.49]
    note: 'ESTIMATE: no measured dough value found; doughs are nearly incompressible, simulation inputs use 0.4 (''Poisson’s
      ratio is ν = 0.4'', https://arxiv.org/pdf/2403.13783)'
plastic:
  yield_stress:
    value: 1994.0
    source: measured
    unc: [1000.0, 4010.0]
    note: 'G''/G'''' crossover in a stress sweep (10-10,000 Pa, 1 Hz, corrugated plates 35 mm, 25 C): ''the yield stress value
      ranged from 1994 ± 74 Pa (WDWOC5%) to 4010 ± 101 Pa (WDHOC15%)'' and ''The WDWOC5% dough did not differ significantly
      in this parameter from the control dough.'', Foods 2024, 13(1), 140 (https://pmc.ncbi.nlm.nih.gov/articles/PMC10779212/);
      the crossover is the end of the linear range, so the onset of flow can be lower: simulation inputs use 1e3 Pa for soft
      pizza dough (https://arxiv.org/pdf/2403.13783)'
