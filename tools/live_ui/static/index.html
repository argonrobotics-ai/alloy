<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alloy Live</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --raise: #eceef2; --text: #15171b; --muted: #6c727c;
  --neutral: #d9dde3; --accent: #2f6bff; --accent-soft: rgba(47,107,255,.12); --ok: #1f9d63; --bad: #e0464b;
  --cloth: #c9b48f; --shadow: 0 6px 24px rgba(20,24,32,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f12; --surface: #16191e; --raise: #1f232a; --text: #e8eaee; --muted: #8a919b;
    --neutral: #2a2f37; --accent: #5b8cff; --accent-soft: rgba(91,140,255,.16); --ok: #2fbf7f; --bad: #f2555a;
    --cloth: #a8916b; --shadow: 0 6px 24px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f12; --surface: #16191e; --raise: #1f232a; --text: #e8eaee; --muted: #8a919b;
  --neutral: #2a2f37; --accent: #5b8cff; --accent-soft: rgba(91,140,255,.16); --ok: #2fbf7f; --bad: #f2555a;
  --cloth: #a8916b; --shadow: 0 6px 24px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
body { font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
       -webkit-font-smoothing: antialiased; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
         padding: max(12px, env(safe-area-inset-top)) 16px 12px; background: var(--bg); }
#back { width: 32px; height: 32px; border-radius: 16px; font-size: 22px; line-height: 30px; margin-left: -6px; }
#back:active { background: var(--raise); }
.title { min-width: 0; flex: 0 1 auto; }
#run { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
#sub { font-size: 12.5px; white-space: nowrap; }
#spark { flex: 1 1 auto; height: 34px; min-width: 60px; }
#spark path.line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
#spark path.area { fill: var(--accent-soft); stroke: none; }
#spark line.mark { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
.stat { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 17px; white-space: nowrap; }
#ret { color: var(--accent); }
.stat small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
#runPause { width: 34px; height: 34px; border-radius: 17px; background: var(--raise); display: grid; place-items: center; flex: none; }
#runPause svg { width: 14px; height: 14px; fill: var(--text); }
#runPause.on { background: var(--accent); }
#runPause.on svg { fill: #fff; }

main { padding: 0 16px 120px; max-width: 1280px; margin: 0 auto; }
.machine { margin: 6px 0 22px; }
.mlabel { font-size: 12.5px; color: var(--muted); margin: 0 0 8px 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18px, 1fr)); gap: 4px; }
.sq { aspect-ratio: 1; border-radius: 4px; background: var(--neutral); transition: background-color .4s; }
.sq.s1 { background: var(--ok); } .sq.s2 { background: var(--bad); } .sq.s3 { opacity: .35; } .sq.s4 { opacity: .25; }
.sq.flag { box-shadow: inset 0 0 0 2px var(--accent); }
.sq:active { transform: scale(.9); }
#overview.past .grid { filter: saturate(.75); }

#media { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#videoBox, #view3d { position: relative; aspect-ratio: 1; background: var(--surface); border-radius: 14px;
                     overflow: hidden; box-shadow: var(--shadow); }
#video { width: 100%; height: 100%; display: block; object-fit: contain; image-rendering: auto; }
#view3d canvas { display: block; touch-action: none; }
#view3d.pushing { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
#toggle { position: absolute; top: 10px; right: 10px; z-index: 2; padding: 5px 11px; border-radius: 14px;
          font-size: 12.5px; background: color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter: blur(8px);
          display: none; }
.wtag { position: absolute; left: 12px; top: 10px; font-size: 12.5px; color: var(--muted); z-index: 2; }
.novideo { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13.5px; padding: 24px; text-align: center; }
.ptag { position: absolute; left: 12px; bottom: 10px; font-size: 12.5px; color: var(--accent); z-index: 2; }

#timeline { position: relative; margin: 16px 2px 6px; height: 34px; }
#marks { position: absolute; left: 0; right: 0; top: 2px; height: 8px; pointer-events: none; }
#marks i { position: absolute; width: 6px; height: 6px; margin-left: -3px; border-radius: 3px; background: var(--muted); }
#marks i.agent { background: var(--accent); }
#scrub { -webkit-appearance: none; appearance: none; position: absolute; left: 0; right: 0; bottom: 4px; width: 100%;
         height: 18px; background: transparent; margin: 0; }
#scrub::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--raise); }
#scrub::-moz-range-track { height: 4px; border-radius: 2px; background: var(--raise); }
#scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 9px;
                               background: var(--accent); }
#scrub::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 9px; background: var(--accent); }
#tnow { position: absolute; right: 0; top: -2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#live { position: absolute; right: 0; top: -6px; padding: 3px 10px; border-radius: 12px; background: var(--accent);
        color: #fff; font-size: 12px; font-weight: 600; }

#bar { display: flex; justify-content: space-between; gap: 6px; margin: 10px 0 0; padding: 6px; border-radius: 16px;
       background: var(--surface); box-shadow: var(--shadow); }
#bar button { flex: 1; padding: 11px 4px; border-radius: 11px; font-weight: 500; font-size: 14.5px; }
#bar button:active, #bar button.on { background: var(--accent-soft); color: var(--accent); }

#logline { margin: 12px 4px 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden;
           text-overflow: ellipsis; cursor: pointer; }
#logline::before { content: ""; display: inline-block; width: 28px; height: 4px; border-radius: 2px;
                   background: var(--raise); vertical-align: middle; margin-right: 10px; }

.sheet, .drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface);
                  border-radius: 18px 18px 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.18);
                  padding: 10px 18px max(18px, env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto;
                  transform: translateY(105%); transition: transform .25s ease, visibility .25s; visibility: hidden; }
.sheet.open, .drawer.open { transform: none; visibility: visible; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--raise); margin: 0 auto 12px; }
.sheet h3, .drawer h3 { margin: 4px 0 12px; font-size: 16px; font-weight: 600; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; }
.row label { font-size: 14.5px; }
.row output { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 56px; text-align: right; }
.row input[type=range] { flex: 1; accent-color: var(--accent); }
.choice { display: block; width: 100%; text-align: left; padding: 13px 14px; border-radius: 12px; background: var(--raise);
          margin: 0 0 8px; }
.choice small { display: block; color: var(--muted); font-size: 12.5px; }
#log { max-height: 55vh; overflow-y: auto; font-size: 13.5px; }
.entry { padding: 9px 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.entry b { font-weight: 600; }
.entry .who { color: var(--muted); font-size: 12px; }
.entry .who.agent { color: var(--accent); }
.entry .res { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
.entry.fail .res { color: var(--bad); }
#scrim { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
#scrim.on { opacity: 1; pointer-events: auto; }
#toast { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 30; transform: translate(-50%, 20px);
         padding: 10px 16px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 13.5px;
         opacity: 0; transition: all .25s; pointer-events: none; max-width: calc(100vw - 32px); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  header { gap: 10px; flex-wrap: wrap; }
  .title { flex: 1 1 auto; }
  .stat { font-size: 15px; }
  #spark { order: 9; flex: 1 0 100%; height: 40px; margin-top: 2px; }
  #media { grid-template-columns: 1fr; }
  #media.show3d #videoBox, #media:not(.show3d) #view3d { display: none; }
  #toggle { display: block; }
  #spark { min-width: 40px; }
}
</style>
</head>
<body>
<header>
  <button id="back" hidden aria-label="Back">&#8249;</button>
  <div class="title"><span id="run">Alloy Live</span><span id="sub" class="muted">connecting</span></div>
  <svg id="spark" viewBox="0 0 100 34" preserveAspectRatio="none"></svg>
  <div class="stat"><span id="ret">-</span><small>return</small></div>
  <div class="stat"><span id="sps">-</span><small>steps / s</small></div>
  <button id="runPause" aria-label="Pause run"><svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg></button>
</header>
<main>
  <section id="overview"><div id="machines"></div></section>
  <section id="world" hidden>
    <div id="media">
      <div id="videoBox"><span class="wtag" id="wtag"></span><canvas id="video" width="256" height="256"></canvas>
        <span class="novideo" id="novideo" hidden>Live video needs Safari 16.4+ or Chrome</span>
        <button id="toggle">3D</button></div>
      <div id="view3d"><span class="ptag" id="ptag" hidden>Drag from an object</span></div>
    </div>
    <div id="timeline"><div id="marks"></div><span id="tnow"></span><button id="live" hidden>Live</button>
      <input id="scrub" type="range" min="0" max="1000" value="1000" aria-label="Timeline"></div>
    <nav id="bar">
      <button data-cmd="pause">Pause</button><button data-cmd="push">Push</button><button data-cmd="fork">Fork</button>
      <button data-cmd="reset">Reset</button><button data-cmd="settings">Settings</button>
    </nav>
    <div id="logline">No commands yet</div>
  </section>
</main>
<div id="scrim"></div>
<div id="sheet" class="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="drawer" class="drawer"><div class="grab"></div><h3>Command log</h3><div id="log"></div></div>
<div id="toast"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
