# RoboCasa category table for the Alloy importer (alloy.importers.robocasa.categories).
#
# objects.<category>:
#   surface: material card whose friction/restitution the object's collision shapes get (the card's `material`)
#   parts:   visual-part role -> material whose density gives that part's mass. Roles come from Lightwheel part
#            names: Clear (transparent shell), Prop (contents or attached item), Lid; everything else is `body`.
#            A role not listed uses `body`.
#   shell_mm: wall thickness for parts whose mesh is open (not watertight); mass = area x thickness x density
#   mass_kg: [lo, hi] plausible mass of a real item (ESTIMATE, sanity bound only; outside it the object is flagged
#            and queued for sourcing)
#   size_m:  [lo, hi] plausible longest extent of a real item (ESTIMATE, sanity bound for the scale check)
#
# fixtures.<kind>: articulated appliances (fixed base). Moving-part masses are the fixture's typical mass split by
#   visual-part volume (ESTIMATE, note says so); `surface` gives friction.
#   mass_kg: typical whole-unit mass (manufacturer spec sheets of common models, rounded; ESTIMATE)
#
# Materials named robocasa_* are defined in materials.yaml next to this file; the rest are Alloy library materials.

