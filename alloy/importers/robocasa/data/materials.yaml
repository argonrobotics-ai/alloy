# New materials for RoboCasa imports (alloy.importers.robocasa.materials).
#
# `surface:` entries become full Alloy material cards (robocasa_<name>.yaml): the object's collision shapes use their
# friction and restitution. `fill:` entries are densities only, used for the mass of a part (a jar's contents, a
# bottle's liquid) and never for contact. Every value is [value, lo, hi] with a source tag and a note. ESTIMATE in a
# note means the value is a model estimate waiting for a better source (queued for the sourcing agent).

surface:
  robocasa_wicker:
    density: [550, 400, 700, model, "ESTIMATE: rattan/wicker 400-700 kg/m3 (dry rattan cane)"]
    mu: [0.4, 0.3, 0.3, 0.5, model, "ESTIMATE: dry woven cane on wood/steel"]
    restitution: [0.3, 0.1, 0.5, model, "ESTIMATE: woven basket, mid value"]
  robocasa_raw_meat:
    density: [1060, 1040, 1080, model, "ESTIMATE: lean muscle tissue 1.04-1.08 g/cm3"]
    mu: [0.4, 0.3, 0.25, 0.6, model, "ESTIMATE: wet raw meat on steel/plastic"]
    restitution: [0.05, 0.0, 0.15, model, "ESTIMATE: soft tissue, near inelastic"]
  robocasa_bread:
    density: [230, 180, 320, model, "ESTIMATE: white pan bread specific volume 3-5.5 ml/g"]
