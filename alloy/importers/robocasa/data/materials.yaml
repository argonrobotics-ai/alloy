    mu: [0.4, 0.3, 0.2, 0.6, model, "ESTIMATE: wet slice"]
    restitution: [0.1, 0.0, 0.2, model, "ESTIMATE: soft produce"]
  robocasa_pizza:
    density: [750, 600, 900, model, "ESTIMATE: baked pizza 0.6-0.9 g/cm3"]
